---
- name: Enforce NoSchedule on control-plane nodes
  hosts: kube_control_plane
  become: true

  tasks:
    - name: Apply NoSchedule taint to control-plane nodes
      command: >
        kubectl taint nodes {{ ansible_hostname }}
        node-role.kubernetes.io/control-plane:NoSchedule --overwrite
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Get taints from node
      command: >
        kubectl get node {{ ansible_hostname }} -o=jsonpath='{.spec.taints}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: taint_output
      changed_when: false

    - name: Fail if taint not found
      assert:
        that:
          - "'NoSchedule' in taint_output.stdout"
