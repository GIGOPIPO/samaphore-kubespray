---
- name: Enforce NoSchedule on control-plane nodes
  hosts: kube_control_plane
  become: true

  tasks:
    - name: Apply NoSchedule taint to control-plane nodes
      command: >
        kubectl taint nodes {{ inventory_hostname }}
        node-role.kubernetes.io/control-plane:NoSchedule --overwrite
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Verify taint applied
      command: >
        kubectl describe node {{ inventory_hostname }} | grep Taints
      register: taint_output

    - name: Debug taint result
      debug:
        var: taint_output.stdout_lines
