---
# Prepare nodes for Kubespray v2.28 (Kubernetes 1.32.x, containerd 2.0.x)
# Compatible with: Ansible 2.17.x, Python 3.10+

- hosts: all
  become: true

  tasks:
    - name: Set timezone to Asia/Bangkok
      community.general.timezone:
        name: Asia/Bangkok

    - name: Check Python version
      ansible.builtin.command: python3 --version
      register: python_version
      changed_when: false
      failed_when: false

    - name: Verify Python 3.10+ is installed
      ansible.builtin.assert:
        that:
          - python_version.rc == 0
          - python_version.stdout is regex('Python 3\.(1[0-9]|[2-9][0-9])\.')
        fail_msg: "Python 3.10+ required for Kubespray v2.28. Found: {{ python_version.stdout | default('Python not found') }}"
        success_msg: "Python version OK: {{ python_version.stdout }}"

    - name: Install required system packages
      apt:
        pkg:
          - open-iscsi
          - curl
        state: present
        update_cache: true
      # open-iscsi: required for iSCSI persistent volumes; curl: used by Kubespray scripts

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0
      # CRITICAL: kubelet fails to start if swap is enabled (--fail-swap-on=true default since k8s 1.8)

    - name: Remove swap entries from /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*([^#\s]+\s+){2}swap\s+'
        state: absent
      # CRITICAL: Prevents swap re-enabling after reboot

    - name: Disable swap in systemd
      ansible.builtin.systemd:
        name: swap.target
        state: stopped
        enabled: false
        masked: true
      ignore_errors: true

    - name: Create kernel modules configuration file
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"
      # CRITICAL: overlay required by containerd; br_netfilter required for CNI iptables rules

    - name: Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Configure sysctl parameters for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        mode: "0644"
      # CRITICAL: Without these, pods cannot communicate across nodes and CNI plugins fail

    - name: Apply sysctl parameters immediately
      ansible.builtin.command: sysctl --system

    - name: Increase inotify limits for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-inotify.conf
        content: |
          fs.inotify.max_user_instances = 512
          fs.inotify.max_user_watches = 524288
        mode: "0644"
      # CRITICAL: Default limits (128/8192) cause "too many open files" errors in production clusters

    - name: Apply inotify limits immediately
      ansible.builtin.command: sysctl --system

    - name: Configure GRUB for cgroup memory accounting
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: "^GRUB_CMDLINE_LINUX="
        line: GRUB_CMDLINE_LINUX="cgroup_enable=memory swapaccount=1"
      # CRITICAL: Required for pod memory limits to work; without this, OOMKiller may not function correctly

    - name: Update GRUB configuration
      ansible.builtin.command: update-grub

    - name: Update GRUB2 configuration (fallback)
      ansible.builtin.command: update-grub2
      ignore_errors: true

    - name: Verify swap is disabled
      ansible.builtin.command: free -h
      register: swap_status
      changed_when: false

    - name: Display swap status
      ansible.builtin.debug:
        msg: "{{ swap_status.stdout_lines }}"

    - name: Reboot to apply kernel parameters and GRUB changes
      ansible.builtin.reboot:
        msg: "Rebooting to apply Kubespray prerequisites"
        reboot_timeout: 600
